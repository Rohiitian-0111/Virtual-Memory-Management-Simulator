<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Memory Visualizer</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">OPERATING SYSTEMS LAB</p><h1>Virtual Memory Visualizer</h1><p>Step through page translation, TLB behavior, page faults and replacement policies.</p></header><section class="controls"><label>Virtual address <input id="addr" type="number" min="0" max="65535" value="2050"></label><label>Policy <select id="policy"><option>LRU</option><option>FIFO</option><option>CLOCK</option></select></label><button id="go">Translate</button><button id="reset" class="ghost">Reset</button></section><section id="flow" class="flow"></section><section class="grid"><article><h2>TLB</h2><div id="tlb"></div></article><article><h2>Physical Frames</h2><div id="frames"></div></article><article><h2>Metrics</h2><div id="metrics"></div></article></section><section><h2>Access Log</h2><div id="log" class="log"></div></section></main><script src="app.js"></script></body></html>
